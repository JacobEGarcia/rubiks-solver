<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rubik's Solver - Scramble & Solve</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;min-height:100vh;background:#0d1117;color:#d7e0ea;font-family:ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{letter-spacing:.35em;font-size:22px;margin:0;color:#ff6b6b}
.tag{color:#5b6774;letter-spacing:.22em;font-size:11px;margin:8px 0 14px}
.hud{color:#5b6774;font-size:12px;letter-spacing:.1em;margin:8px 0 12px}
.hud b{color:#ff6b6b}
.net{display:grid;grid-template-columns:repeat(12,22px);grid-template-rows:repeat(9,22px);gap:2px;margin:8px 0 12px}
.s{border-radius:3px;border:1px solid #00000044}
.moves{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:380px;margin-bottom:8px}
button{background:#151c26;border:1px solid #2b3646;color:#9fb6cf;border-radius:6px;padding:7px 11px;font-family:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer}
button:hover{background:#ff6b6b;color:#0d1117}
.big{padding:10px 18px;letter-spacing:.2em}
.log{color:#5b6774;font-size:11px;max-width:360px;text-align:center;line-height:1.7;min-height:20px}
.solved{color:#7dffa8;font-size:12px;letter-spacing:.2em;margin-top:8px;min-height:16px}
</style></head><body>
<h1>RUBIK'S SOLVER</h1><div class="tag">SCRAMBLE IT · WATCH IT SOLVE ITSELF</div>
<div class="hud">MOVES <b id="sM">0</b> · STATE <b id="sS">SOLVED</b></div>
<div class="net" id="net"></div>
<div class="moves" id="mv"></div>
<div><button class="big" onclick="scramble()">SCRAMBLE</button> <button class="big" onclick="solve()">SOLVE</button></div>
<div class="log" id="log"></div><div class="solved" id="win"></div>
<script>
const F=['U','R','F','D','L','B'];
const COL={U:'#f5f5f5',R:'#ff5252',F:'#69f07d',D:'#ffd94d',L:'#ff9436',B:'#4d7bff'};
let cube, hist=[], moves=0, busy=false;
function reset(){cube={};F.forEach(f=>cube[f]=Array(9).fill(f));hist=[];moves=0;}
// facelet permutation per move (indices 0..8 row-major per face)
function rot(a){return [a[6],a[3],a[0],a[7],a[4],a[1],a[8],a[5],a[2]];}
const EDGE={ // [face,[i0,i1,i2]] strips cycled
 U:[['F',[0,1,2]],['R',[0,1,2]],['B',[0,1,2]],['L',[0,1,2]]],
 D:[['F',[6,7,8]],['L',[6,7,8]],['B',[6,7,8]],['R',[6,7,8]]],
 R:[['F',[2,5,8]],['U',[2,5,8]],['B',[6,3,0]],['D',[2,5,8]]],
 L:[['F',[0,3,6]],['D',[0,3,6]],['B',[8,5,2]],['U',[0,3,6]]],
 F:[['U',[6,7,8]],['R',[0,3,6]],['D',[2,1,0]],['L',[8,5,2]]],
 B:[['U',[2,1,0]],['L',[0,3,6]],['D',[6,7,8]],['R',[8,5,2]]]};
function move(m,quiet){ // m like "R" or "R'"
 const face=m[0], prime=m.length>1;
 for(let t=0;t<(prime?3:1);t++){
  cube[face]=rot(cube[face]);
  const s=EDGE[face], tmp=s[3][1].map(i=>cube[s[3][0]][i]);
  for(let k=2;k>=0;k--) s[k+1][1].forEach((ix,j)=>cube[s[k+1][0]][ix]=cube[s[k][0]][s[k][1][j]]);
  s[0][1].forEach((ix,j)=>cube[s[0][0]][ix]=tmp[j]);}
 if(!quiet){hist.push(m);moves++;render();}}
const INV=m=>m.length>1?m[0]:m+"'";
function render(){
 const net=document.getElementById('net');let h='';
 const pos={U:[0,3],L:[3,0],F:[3,3],R:[3,6],B:[3,9],D:[6,3]};
 F.forEach(f=>{const[r,c]=pos[f];for(let i=0;i<9;i++){
  h+=`<div class="s" style="grid-row:${r+Math.floor(i/3)+1};grid-column:${c+i%3+1};background:${COL[cube[f][i]]}"></div>`;}});
 net.innerHTML=h;
 document.getElementById('sM').textContent=moves;
 document.getElementById('sS').textContent=isSolved()?'SOLVED':'SCRAMBLED';}
function isSolved(){return F.every(f=>cube[f].every(v=>v===f));}
function scramble(){if(busy)return;reset();
 const seq=[];let last='';
 for(let i=0;i<18;i++){let f;do{f=F[Math.floor(Math.random()*6)]}while(f===last);last=f;
  const m=f+(Math.random()<.5?"'":'');seq.push(m);move(m);}
 document.getElementById('log').textContent='scramble: '+seq.join(' ');
 document.getElementById('win').textContent='';render();}
async function solve(){if(busy||!hist.length)return;busy=true;
 document.getElementById('log').textContent='solving...';
 while(hist.length){const m=INV(hist.pop());move(m,true);moves++;render();
  await new Promise(r=>setTimeout(r,120));}
 document.getElementById('log').textContent='';
 document.getElementById('win').textContent='SOLVED · THE CUBE IS AT PEACE';busy=false;}
document.getElementById('mv').innerHTML=F.map(f=>`<button onclick="move('${f}')">${f}</button><button onclick="move('${f}\\'')">${f}'</button>`).join('');
reset();render();
</script></body></html>
